<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087ca7"><title>Fluid Log</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"></head><body><main><header><div><p class="eyebrow">DAILY HYDRATION</p><h1>Fluid Log</h1></div><input id="day" type="date" aria-label="Day"></header><section class="summary"><p>Logged today</p><strong><span id="total">0</span> <small>fl oz</small></strong><div class="progress"><i id="bar"></i></div><label>Daily target <input id="goal" type="number" min="1" max="500" placeholder="Set target"> oz</label></section><section><h2>Quick add</h2><div class="quick"><button data-type="Water" data-oz="16.9">+ 16.9 Water</button><button data-type="Water" data-oz="20">+ 20 Water</button><button data-type="Powerade" data-oz="20">+ 20 Powerade</button><button data-type="Gatorade Zero" data-oz="20">+ 20 Gatorade</button></div></section><section class="card"><h2>Add a drink</h2><form id="form"><label>Drink<input id="type" required value="Water" maxlength="40"></label><label>Amount (oz)<input id="amount" required type="number" inputmode="decimal" min="0.1" max="500" step="0.1" value="16.9"></label><label>Finished at<input id="time" required type="time"></label><button class="primary">Add drink</button></form></section><section><div class="row"><h2>Daily log</h2><button id="export" class="link">Export CSV</button></div><div id="entries"></div></section><section class="card"><div class="row"><h2>Backup</h2><button id="backup" class="link">Download</button></div><label class="restore">Restore backup<input id="restore" type="file" accept="application/json"></label></section><p class="note">This tracker records what you drink. The optional target is not a medical recommendation.</p></main><script src="./app.js"></script></body></html>
